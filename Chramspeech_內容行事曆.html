<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chramspeech | 內容行事曆</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1814;--paper:#FAF8F5;--sage:#4A6741;--sage-l:#EAF0E8;--sage-d:#2D4028;--clay:#C4714A;--clay-l:#FAF0EB;--clay-d:#8B3D1A;--slate:#5A6470;--slate-l:#EEF0F2;--gold:#B8A060;--gold-l:#FAF5E8;--live:#D63F3F;--live-l:#FFF0F0;--grn:#00A651;--grn-l:#E6F7EF;--bd:#E2DDD8;--bd2:#EDE9E4;--r:8px;--rl:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.6;min-height:100vh}
.hd{padding:18px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:#fff}
.hlogo{display:flex;align-items:baseline;gap:10px}
.hbrand{font-family:"DM Serif Display",serif;font-size:20px}
.htagline{font-size:11px;color:var(--slate);letter-spacing:.06em;font-family:"DM Mono",monospace}
.htag{font-size:11px;background:var(--sage-l);color:var(--sage-d);border:1px solid var(--sage);padding:3px 12px;border-radius:20px;font-weight:500}
.wrap{display:grid;grid-template-columns:1fr 330px;min-height:calc(100vh - 57px)}
.left{padding:20px 28px;border-right:1px solid var(--bd)}
.right{background:#fff}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cn{width:28px;height:28px;border:1px solid var(--bd);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--slate)}
.cn:hover{border-color:var(--sage);color:var(--sage)}
.cmo{font-family:"DM Serif Display",serif;font-size:18px;flex:1}
.cphase{font-size:10px;font-family:"DM Mono",monospace;color:var(--clay);background:var(--clay-l);border:1px solid rgba(196,113,74,.3);padding:3px 10px;border-radius:20px}
.leg{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--slate);font-family:"DM Mono",monospace}
.ld{width:7px;height:7px;border-radius:2px}
.wds{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.wd{text-align:center;font-size:10px;color:var(--slate);padding:4px 0;font-family:"DM Mono",monospace}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{background:#fff;border:1px solid var(--bd2);border-radius:var(--r);min-height:76px;cursor:pointer;transition:border-color .12s,background .12s;overflow:hidden}
.cell:hover{border-color:var(--sage)}
.cell.today{border-color:var(--clay)!important;border-width:1.5px}
.cell.active{border-color:var(--sage)!important;background:var(--sage-l)}
.cell.empty{border:none;background:transparent;cursor:default;min-height:0}
.cell.empty:hover{border:none}
.cell.hlive{border-color:var(--live)!important}
.cell.hsales{border-color:var(--gold)!important}
.cnum{padding:5px 7px 3px;display:flex;justify-content:space-between;align-items:center}
.cdn{font-size:11px;font-weight:500;font-family:"DM Mono",monospace}
.cell.today .cdn{color:var(--clay)}
.ctod{font-size:9px;background:var(--clay);color:#fff;padding:1px 4px;border-radius:4px;font-weight:500;margin-left:3px}
.cdots{display:flex;gap:2px}
.dot{width:4px;height:4px;border-radius:50%}
.ds{background:var(--sage)}.dc{background:var(--gold)}.dr{background:var(--clay)}.dl{background:var(--live)}.dn{background:var(--grn)}
.ctags{padding:1px 6px 5px;display:flex;flex-direction:column;gap:2px}
.ctag{font-size:9px;padding:2px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;font-family:"DM Mono",monospace}
.ts{background:var(--sage-l);color:var(--sage-d)}.tc{background:var(--gold-l);color:#6B5010}.tr{background:var(--clay-l);color:var(--clay-d)}.tl{background:var(--live-l);color:var(--live)}.tn{background:var(--grn-l);color:#007A3D}
.cmore{font-size:9px;color:var(--slate);padding:0 6px 3px;font-family:"DM Mono",monospace}
.det{display:flex;flex-direction:column;height:calc(100vh - 57px);position:sticky;top:0}
.det-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 24px;text-align:center;color:var(--slate);font-size:13px;line-height:1.7}
.det-head{padding:18px 20px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
.det-date{font-family:"DM Serif Display",serif;font-size:18px}
.det-ph{font-size:10px;font-family:"DM Mono",monospace;margin-top:3px}
.det-body{padding:14px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.tcard{border:1px solid var(--bd2);border-radius:var(--rl);overflow:hidden}
.tcard.clive{border-color:var(--live)}.tcard.csales{border-color:var(--gold)}
.tcard-head{padding:7px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd2)}
.tbadge{font-size:9px;font-family:"DM Mono",monospace;font-weight:500;padding:2px 7px;border-radius:3px;flex-shrink:0}
.tbs{background:var(--sage-l);color:var(--sage-d)}.tbc{background:var(--gold-l);color:#6B5010}.tbr{background:var(--clay-l);color:var(--clay-d)}.tbl{background:var(--live-l);color:var(--live)}.tbsal{background:#FFF8E6;color:#8B6000;border:1px solid var(--gold)}.tbn{background:var(--grn-l);color:#007A3D}
.tlabel{font-size:12px;font-weight:500}
.fw-wrap{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.fw-row{display:flex;gap:8px;align-items:flex-start}
.fw-tag{font-size:9px;font-family:"DM Mono",monospace;font-weight:500;padding:2px 6px;border-radius:3px;flex-shrink:0;margin-top:2px;line-height:1.5}
.fws .fw-tag{background:#FFF3EA;color:var(--clay-d)}.fwp .fw-tag{background:var(--sage-l);color:var(--sage-d)}.fwc .fw-tag{background:#EEF0F8;color:#3D2980}
.fw-text{font-size:12px;line-height:1.65}
.sep{border:none;border-top:1px dashed var(--bd);margin:0}
.t-simple{padding:10px 12px;font-size:12px;line-height:1.6}
.t-sub{font-size:11px;color:var(--slate);margin-top:4px;padding-left:8px;border-left:2px solid var(--bd)}
.pha{color:var(--clay)}.phb{color:var(--sage)}.phc{color:#7A5EA0}.phd{color:var(--live)}.phe{color:var(--gold)}
</style>
</head>

<script>
var D = JSON.parse(document.getElementById('jd').textContent);
var MN = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
var WN = ['日','一','二','三','四','五','六'];
var PHL = {A:'Phase A · 共鳴期',B:'Phase B · 方法期',C:'Phase C · 預熱期',D:'Phase D · 開賣期',E:'Phase E · 穩定期'};
var PHC = {A:'pha',B:'phb',C:'phc',D:'phd',E:'phe'};
var cy=2026, cm=4, sel=null;
function pad(n){return n<10?'0'+n:''+n;}
function tdc(t){return t=='s'?'ds':t=='c'?'dc':t=='r'?'dr':t=='l'?'dl':'dn';}
function tcc(t){return t=='s'?'ts':t=='c'?'tc':t=='r'?'tr':t=='l'?'tl':'tn';}
function tbc(t){return t=='s'?'tbs':t=='c'?'tbc':t=='r'?'tbr':t=='l'?'tbl':'tbn';}
function tbt(t){return t=='s'?'限動':t=='c'?'輪播':t=='r'?'Reels':t=='l'?'直播':'LINE';}
function uniq(a){var s={},r=[];for(var i=0;i<a.length;i++){if(!s[a[i]]){s[a[i]]=1;r.push(a[i]);}}return r;}
function mk(tag,cls){var el=document.createElement(tag);if(cls)el.className=cls;return el;}
function tx(str){return document.createTextNode(str);}

function renderCal(){
  document.getElementById('cmo').textContent = cy+' 年 '+MN[cm]+' 月';
  var pfx = cy+'-'+pad(cm+1);
  var phs = [];
  for(var k in D){if(k.indexOf(pfx)===0) phs.push(D[k].ph);}
  phs = uniq(phs);
  document.getElementById('cphase').textContent = phs.map(function(p){
    var l=PHL[p]; return l?l.split('·')[1].trim():'';
  }).filter(function(x){return x;}).join(' / ');
  var first=new Date(cy,cm,1).getDay();
  var days=new Date(cy,cm+1,0).getDate();
  var td=new Date();
  var tds=td.getFullYear()+'-'+pad(td.getMonth()+1)+'-'+pad(td.getDate());
  var grid=document.getElementById('cgrid');
  grid.innerHTML='';
  for(var i=0;i<first;i++){var emp=mk('div','cell empty');grid.appendChild(emp);}
  for(var d=1;d<=days;d++){
    var ds=cy+'-'+pad(cm+1)+'-'+pad(d);
    var dd=D[ds];
    var isT=(ds===tds), isA=(ds===sel);
    var hasLive=false, hasSales=false;
    if(dd){for(var j=0;j<dd.items.length;j++){var it=dd.items[j];if(it.t==='l'){if(it.lb.indexOf('銷講')>=0)hasSales=true;else hasLive=true;}}}
    var cls='cell'+(isT?' today':'')+(isA?' active':'')+(hasSales?' hsales':hasLive?' hlive':'');
    var cell=mk('div',cls);
    cell.setAttribute('data-ds',ds);
    cell.onclick=function(){pick(this.getAttribute('data-ds'));};
    var cnum=mk('div','cnum');
    var cdn=mk('span','cdn'); cdn.appendChild(tx(''+d));
    if(isT){var ctod=mk('span','ctod');ctod.appendChild(tx('今'));cdn.appendChild(ctod);}
    cnum.appendChild(cdn);
    var cdots=mk('div','cdots');
    if(dd){var types=uniq(dd.items.map(function(x){return x.t;}));for(var j=0;j<types.length;j++){var dot=mk('div','dot '+tdc(types[j]));cdots.appendChild(dot);}}
    cnum.appendChild(cdots);
    cell.appendChild(cnum);
    if(dd){
      var ctags=mk('div','ctags');
      var lim=dd.items.length>2?2:dd.items.length;
      for(var k=0;k<lim;k++){
        var tag=mk('div','ctag '+tcc(dd.items[k].t));
        var lb=dd.items[k].lb;
        tag.appendChild(tx(lb.length>15?lb.slice(0,14)+'…':lb));
        ctags.appendChild(tag);
      }
      if(dd.items.length>2){var cm2=mk('div','cmore');cm2.appendChild(tx('+'+(dd.items.length-2)));ctags.appendChild(cm2);}
      cell.appendChild(ctags);
    }
    grid.appendChild(cell);
  }
}

function pick(ds){
  sel=ds; renderCal();
  var dd=D[ds];
  var det=document.getElementById('det');
  det.innerHTML='';
  if(!dd){
    var emp=mk('div','det-empty'); emp.appendChild(tx('☁')); emp.appendChild(document.createElement('br')); emp.appendChild(tx('這天沒有排定任務'));
    det.appendChild(emp); return;
  }
  var d=new Date(ds);
  var head=mk('div','det-head');
  var ddate=mk('div','det-date');
  ddate.appendChild(tx((d.getMonth()+1)+' 月 '+d.getDate()+' 日（週'+WN[d.getDay()]+'）'));
  head.appendChild(ddate);
  var dph=mk('div','det-ph '+(PHC[dd.ph]||''));
  dph.appendChild(tx(PHL[dd.ph]||''));
  head.appendChild(dph);
  det.appendChild(head);
  var body=mk('div','det-body');
  for(var i=0;i<dd.items.length;i++){
    var item=dd.items[i];
    var isSales=(item.t==='l'&&item.lb.indexOf('銷講')>=0);
    var isLive=(item.t==='l'&&!isSales);
    var cardCls='tcard'+(isSales?' csales':isLive?' clive':'');
    var card=mk('div',cardCls);
    var cardHead=mk('div','tcard-head');
    var badge=mk('span',isSales?'tbadge tbsal':'tbadge '+tbc(item.t));
    badge.appendChild(tx(isSales?'銷講':tbt(item.t)));
    cardHead.appendChild(badge);
    var lbl=mk('span','tlabel'); lbl.appendChild(tx(item.lb));
    cardHead.appendChild(lbl);
    card.appendChild(cardHead);
    if(item.fw){
      var fw=mk('div','fw-wrap');
      function addRow(cls,tag,text){var row=mk('div','fw-row '+cls);var ft=mk('span','fw-tag');ft.appendChild(tx(tag));row.appendChild(ft);var ft2=mk('span','fw-text');ft2.appendChild(tx(text));row.appendChild(ft2);return row;}
      fw.appendChild(addRow('fws','故事',item.fw.story));
      fw.appendChild(mk('hr','sep'));
      fw.appendChild(addRow('fwp','佐證',item.fw.proof));
      fw.appendChild(mk('hr','sep'));
      fw.appendChild(addRow('fwc','CTA',item.fw.cta));
      card.appendChild(fw);
    } else {
      var simp=mk('div','t-simple'); simp.appendChild(tx(item.desc));
      if(item.sub){var sub=mk('div','t-sub');sub.appendChild(tx(item.sub));simp.appendChild(sub);}
      card.appendChild(simp);
    }
    body.appendChild(card);
  }
  det.appendChild(body);
}

function pm(){if(cm===0){cm=11;cy--;}else{cm--;}sel=null;renderCal();var det=document.getElementById('det');det.innerHTML='<div class="det-empty">&#9728;<br>點選左側日期<br>查看當天內容方向</div>';}
function nm(){if(cm===11){cm=0;cy++;}else{cm++;}sel=null;renderCal();var det=document.getElementById('det');det.innerHTML='<div class="det-empty">&#9728;<br>點選左側日期<br>查看當天內容方向</div>';}
renderCal();
</script>
